<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreetBid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  color-scheme: light;
  /* Layout concept: a kerbside ledger. A feed of street-spotted cars, each priced on a number-plate badge; a car opens into a bid sheet with a ledger of valuations. */
  --bg: #EDF0EC;
  --surface: #FAFBF9;
  --ink: #121915;
  --muted: #56635B;
  --line: #D3DAD3;
  --accent: #0D6A4B;
  --accent-ink: #FFFFFF;
  --amber: #8A5508;
  --amber-bg: #F6E8CC;
  --plate: #F2DE6B;
  --plate-ink: #17190F;
  --road-a: #2B332E;
  --road-b: #1F2622;
  --lane: #C9D1C9;
  --danger: #A12B2B;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #161F1A; --ink: #E8EEE9; --muted: #93A399; --line: #26332B;
    --accent: #4CD3A0; --accent-ink: #05281C; --amber: #E5AE5B; --amber-bg: #3A2C12;
    --plate: #F2DE6B; --plate-ink: #17190F; --road-a: #1B221E; --road-b: #121714; --lane: #46524B; --danger: #F08A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #161F1A; --ink: #E8EEE9; --muted: #93A399; --line: #26332B;
  --accent: #4CD3A0; --accent-ink: #05281C; --amber: #E5AE5B; --amber-bg: #3A2C12;
  --plate: #F2DE6B; --plate-ink: #17190F; --road-a: #1B221E; --road-b: #121714; --lane: #46524B; --danger: #F08A8A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: .9; letter-spacing: .02em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); background: var(--surface); }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 7px; }
.chip.live::before { background: var(--accent); }
.chip.warn::before { background: var(--amber); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; color: var(--muted); font-size: .92rem; }
.notice { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.notice[hidden] { display: none; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 14px; background: #0A0F14; aspect-ratio: 1120 / 260; }
@media (max-width: 700px) { .hero { aspect-ratio: auto; height: 160px; } }
.heroart, .heroart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 44px; font-size: 16px; }
.count { margin-left: auto; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }

/* feed */
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { display: block; text-align: left; width: 100%; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.shot { position: relative; display: block; aspect-ratio: 4 / 3; max-width: 100%; background: var(--road-a); }
.shot img, .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.card:hover .shot img, .card:hover .shot svg { transform: scale(1.04); }
.meta .row .soon { color: var(--amber); }
.plate { position: absolute; z-index: 2; left: 10px; bottom: 10px; display: grid; gap: 0; background: linear-gradient(180deg, #F7E98A, #EBD25A); color: var(--plate-ink); border-radius: 6px; padding: 3px 16px 5px; box-shadow: inset 0 0 0 2px var(--plate-ink), 0 3px 10px rgba(0,0,0,.4); }
.plate::before, .plate::after { content: ""; position: absolute; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--plate-ink); opacity: .55; }
.plate::before { left: 5px; }
.plate::after { right: 5px; }
.shot::after { content: ""; position: absolute; inset: auto 0 0 0; height: 42%; background: linear-gradient(to top, rgba(0,0,0,.5), transparent); pointer-events: none; }
.plate small { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
.plate b { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tag { position: absolute; z-index: 2; top: 10px; left: 10px; font-family: var(--f-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; background: rgba(10, 14, 12, .72); color: #F1F5F2; padding: 3px 8px; border-radius: 4px; }
.tag.right { left: auto; right: 10px; }
.meta { display: block; padding: 12px 14px 14px; }
.meta h3 { margin: 0; font-size: 1.05rem; line-height: 1.25; font-weight: 700; }
.meta .where { display: block; color: var(--muted); font-size: .9rem; }
.meta .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
.meta .row .you { color: var(--accent); font-weight: 500; }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 10px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
.empty h2 { margin: 0; font-family: var(--f-display); font-size: 1.8rem; color: var(--ink); text-transform: uppercase; letter-spacing: .02em; }
.empty p { margin: 0; max-width: 44ch; }

/* dialogs */
dialog { padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(6, 10, 8, .6); }
.sheet { display: grid; gap: 16px; padding: 0 0 20px; }
.sheet > :not(.shot):not(.sheet-head) { margin-inline: 20px; }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 18px 20px 0; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.sheet-head p { margin: 4px 0 0; color: var(--muted); }
.x { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 40px; height: 40px; cursor: pointer; flex: none; font-size: 1.2rem; line-height: 1; }
.x:hover { border-color: var(--accent); }
.sheet .shot { aspect-ratio: 16 / 9; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.band { margin: 0; color: var(--muted); font-size: .92rem; }
.note { margin: 0; }
.bidform { display: grid; gap: 8px; }
.bidform label, .spotform label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.bidrow { display: flex; gap: 10px; flex-wrap: wrap; }
.amount { display: flex; flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.amount span { display: grid; place-items: center; padding: 0 12px; font-family: var(--f-mono); font-size: .85rem; color: var(--muted); border-right: 1px solid var(--line); }
.amount input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font-size: 16px; font-variant-numeric: tabular-nums; min-height: 44px; }
.amount input:focus-visible { outline: none; }
.amount:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { margin: 0; color: var(--danger); font-size: .9rem; min-height: 0; }
.err:empty { display: none; }
.ledger { list-style: none; margin: 0 20px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ledger li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.ledger li:first-child { border-top: 0; }
.ledger .amt { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.ledger .who { grid-column: 1; font-size: .84rem; color: var(--muted); }
.ledger .pill { grid-row: 1 / span 2; grid-column: 2; }
.pill { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.lead { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.held { background: var(--amber-bg); border-color: transparent; color: var(--amber); }
h3.sec { margin: 0; font-size: .8rem; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* spot form */
.spotform { display: grid; gap: 14px; padding: 0 20px 20px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.grid2 > div, .spotform > div { display: grid; gap: 4px; min-width: 0; }
.drop { position: relative; display: grid; place-items: center; text-align: center; border: 1.5px dashed var(--line); border-radius: 10px; min-height: 150px; overflow: hidden; cursor: pointer; color: var(--muted); padding: 14px; }
.drop:hover, .drop:focus-within { border-color: var(--accent); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop img[hidden] { display: none; }
.drop strong { color: var(--ink); display: block; }
.hint { margin: 0; font-size: .84rem; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .92rem; z-index: 50; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .card, .card:hover, .shot img, .shot svg, .card:hover .shot img, .card:hover .shot svg { transition: none; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Street<span>Bid</span></h1>
      <p>See a car on the street, photograph it and put a resale value on it. Anyone can bid. The highest valid bid wins when the clock runs out.</p>
    </div>
    <div class="actions">
      <span class="chip" id="mode">Connecting</span>
      <button class="btn" id="spotBtn" type="button">Spot a car</button>
    </div>
  </header>
  <div class="hero" aria-hidden="true"><div class="heroart" id="heroArt"></div></div>

  <p class="notice" id="banner" hidden><span id="bannerText"></span><button class="btn ghost" type="button" id="reset">Reset examples</button></p>

  <div class="toolbar">
    <div class="grow"><input class="field" id="q" type="search" placeholder="Search make, model or city" aria-label="Search spotted cars"></div>
    <select class="field" id="sort" aria-label="Sort spotted cars" style="width:auto">
      <option value="closing">Closing soon</option>
      <option value="newest">Newest</option>
      <option value="bids">Most bids</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <main class="feed" id="feed" aria-live="polite"></main>
</div>

<dialog id="spot" aria-labelledby="spotTitle">
  <div class="sheet" style="padding-bottom:0">
    <div class="sheet-head"><div><h2 id="spotTitle">Spot a car</h2><p>Your resale value opens the bidding.</p></div><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
  </div>
  <form class="spotform" id="spotForm" novalidate>
    <label class="drop" for="photo" id="drop">
      <img id="preview" alt="Preview of the photo you picked" hidden>
      <span id="dropText"><strong>Take or choose a photo</strong>Keep number plates and people out of the frame.</span>
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <div class="grid2">
      <div><label for="make">Make</label><input class="field" id="make" maxlength="40" placeholder="Maruti Suzuki" autocomplete="off" required></div>
      <div><label for="model">Model</label><input class="field" id="model" maxlength="40" placeholder="Swift VXi" autocomplete="off" required></div>
      <div><label for="year">Year</label><input class="field" id="year" type="number" inputmode="numeric" min="1950" max="2100" placeholder="2019" required></div>
      <div><label for="city">City</label><input class="field" id="city" maxlength="50" placeholder="Where you saw it" autocomplete="off" required></div>
      <div><label for="body">Body type</label><select class="field" id="body"><option value="hatch">Hatchback</option><option value="sedan" selected>Sedan</option><option value="suv">SUV</option><option value="pickup">Pickup</option><option value="mini">Compact</option></select></div>
      <div><label for="colour">Colour</label><select class="field" id="colour"><option value="#C8442F">Red</option><option value="#2F5D8C">Blue</option><option value="#E6E3DA">White</option><option value="#3E7C59">Green</option><option value="#6C757B">Grey</option><option value="#23282B">Black</option><option value="#B8892B">Gold</option><option value="#D9772B">Orange</option></select></div>
    </div>
    <div class="grid2">
      <div><label for="cur">Currency</label>
        <select class="field" id="cur"><option>INR</option><option>USD</option><option>CAD</option><option>GBP</option><option>EUR</option><option>AED</option><option>AUD</option></select></div>
      <div><label for="value">Your resale value</label>
        <input class="field" id="value" type="number" inputmode="numeric" min="1" step="1" placeholder="540000" required></div>
      <div><label for="window">Bidding stays open</label>
        <select class="field" id="window"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72" selected>3 days</option><option value="168">7 days</option></select></div>
    </div>
    <div><label for="noteIn">Note (optional)</label><textarea class="field" id="noteIn" rows="2" maxlength="200" placeholder="Condition, colour, anything you noticed"></textarea></div>
    <p class="err" id="spotErr" role="alert"></p>
    <div class="bidrow"><button class="btn" type="submit" id="spotSubmit">Post this car</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
  </form>
</dialog>

<dialog id="detail" aria-label="Car details"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var DAY = 864e5, HOUR = 36e5, MIN = 6e4;
  var LOCALE = { INR: 'en-IN', USD: 'en-US', CAD: 'en-CA', GBP: 'en-GB', EUR: 'de-DE', AED: 'en-AE', AUD: 'en-AU' };
  var BAND_LO = 0.6, BAND_HI = 1.6;
  var S = { cars: new Map(), bids: [], mode: 'loading', uid: null, write: true, sort: 'closing', q: '', open: null, A: new Map() };
  var db = null, photoData = null, toastTimer = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n, cur) {
    try { return new Intl.NumberFormat(LOCALE[cur] || 'en-US', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(n); }
    catch (e) { return cur + ' ' + Math.round(n); }
  }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
  function timeLeft(t) {
    var ms = t - Date.now(); if (ms <= 0) return 'Closed';
    var d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / MIN);
    return d > 0 ? d + 'd ' + h + 'h left' : h > 0 ? h + 'h ' + m + 'm left' : Math.max(m, 1) + 'm left';
  }
  function ago(t) {
    var ms = Date.now() - t; if (ms < MIN) return 'just now';
    if (ms < HOUR) return Math.floor(ms / MIN) + ' min ago';
    if (ms < DAY) return Math.floor(ms / HOUR) + ' h ago';
    return Math.floor(ms / DAY) + ' d ago';
  }
  function okPhoto(p) { return typeof p === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p); }
  function okPaint(p) { return typeof p === 'string' && /^#[0-9a-fA-F]{6}$/.test(p) ? p : '#7A8A80'; }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }

  /* A bid counts when it lands inside a band around the crowd value of the bids that already count.
     The first bid is the spotter's own value and opens the band. Anything outside is held. */
  function analyse(carId) {
    var list = S.bids.filter(function (b) { return b.carId === carId; }).sort(function (a, b) { return a.ts - b.ts; });
    var valid = [], rows = [], alias = {}, n = 0;
    list.forEach(function (b) {
      var ok = true;
      if (valid.length) { var m = median(valid.map(function (x) { return x.amount; })); ok = b.amount >= m * BAND_LO && b.amount <= m * BAND_HI; }
      if (!(b.bidderId in alias)) alias[b.bidderId] = String.fromCharCode(65 + (n++ % 26));
      var r = Object.assign({}, b, { ok: ok }); if (ok) valid.push(r); rows.push(r);
    });
    var lead = valid.reduce(function (a, b) { return !a || b.amount > a.amount ? b : a; }, null);
    var crowd = valid.length ? median(valid.map(function (x) { return x.amount; })) : null;
    return { rows: rows, lead: lead, crowd: crowd, band: crowd ? [crowd * BAND_LO, crowd * BAND_HI] : null, count: list.length, alias: alias };
  }
  function who(a, id) { return id === S.uid ? 'You' : 'Bidder ' + (a.alias[id] || '?'); }

  /* ---------- graphics ---------- */
  var gid = 0;
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function mix(hex, t) {
    var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255, to = t > 0 ? 255 : 0, a = Math.abs(t);
    r = Math.round(r + (to - r) * a); g = Math.round(g + (to - g) * a); b = Math.round(b + (to - b) * a);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
  var SKIES = [
    { top: '#16213A', bot: '#E08A4B', bld: '#0F1624', win: '#FFD98A', road1: '#2A2F33', road2: '#14181A', moon: false, lit: true, glow: true },
    { top: '#050A14', bot: '#1F3556', bld: '#070B13', win: '#FFE3A1', road1: '#232A31', road2: '#0E1215', moon: true, lit: true, glow: true },
    { top: '#2D5A78', bot: '#CFE1D6', bld: '#4D6468', win: '#FFF3C4', road1: '#4A5156', road2: '#2A2F32', moon: false, lit: false, glow: false }

    var car = { make: g('make'), model: g('model'), year: year, city: g('city'), cur: g('cur'), paint: $('#colour').value, body: $('#body').value,
      photo: photoData, note: g('noteIn'), spotterId: S.uid, createdAt: now, closesAt: now + Number($('#window').value) * HOUR };
    try {
      await putCar(id, car);
      await addBid({ carId: id, amount: amount, bidderId: S.uid, ts: now + 1, spotter: true });
      $('#spot').close(); render(); toast('Posted. Your value of ' + money(amount, car.cur) + ' opens the bidding.');
    } catch (x) { dbFail(x); }
    btn.disabled = false;
  });

  setInterval(function () {
    document.querySelectorAll('[data-closes]').forEach(function (el) { el.textContent = timeLeft(Number(el.dataset.closes)); });
  }, 30000);

  /* ---------- boot ---------- */
  var SPEC = [
    { k: 'swift', body: 'hatch', make: 'Maruti Suzuki', model: 'Swift VXi', year: 2019, city: 'Mumbai', cur: 'INR', paint: '#C8442F', note: 'Parked outside a cafe. One small dent on the rear bumper.', age: 20, close: 52, bids: [[540000, 19, 'a'], [510000, 15, 'b'], [535000, 11, 'c'], [900000, 8, 'd'], [555000, 3, 'b']] },
    { k: 'civic', body: 'sedan', make: 'Honda', model: 'Civic LX', year: 2017, city: 'Toronto', cur: 'CAD', paint: '#2F5D8C', note: 'Clean paint, winter tyres still on.', age: 31, close: 20, bids: [[14200, 30, 'a'], [13100, 22, 'c'], [14000, 14, 'b']] },
    { k: 'lc', body: 'suv', make: 'Toyota', model: 'Land Cruiser GXR', year: 2021, city: 'Dubai', cur: 'AED', paint: '#D9D6CC', note: 'Spotted at a valet stand. Looks barely used.', age: 40, close: 70, bids: [[245000, 39, 'b'], [232000, 30, 'a'], [251000, 12, 'd']] },
    { k: 'mini', body: 'mini', make: 'Mini', model: 'Cooper S', year: 2015, city: 'London', cur: 'GBP', paint: '#3E7C59', note: 'Roof scuffs, otherwise tidy.', age: 8, close: 118, bids: [[7800, 7, 'c'], [7250, 4, 'a']] },
    { k: 'f150', body: 'pickup', make: 'Ford', model: 'F-150 XLT', year: 2020, city: 'Austin', cur: 'USD', paint: '#4A5058', note: 'Tow package. Bed liner fitted.', age: 60, close: 8, bids: [[31500, 58, 'a'], [30200, 40, 'd'], [33000, 21, 'b']] }
  ];
  function loadDemo() {
    var now = Date.now();
    SPEC.forEach(function (s) {
      S.cars.set('demo_' + s.k, { id: 'demo_' + s.k, make: s.make, model: s.model, year: s.year, city: s.city, cur: s.cur, paint: s.paint, body: s.body, photo: null, note: s.note, spotterId: 'seed_' + s.bids[0][2], createdAt: now - s.age * HOUR, closesAt: now + s.close * HOUR, example: true });
      s.bids.forEach(function (b, i) { S.bids.push({ id: 'demo_' + s.k + i, carId: 'demo_' + s.k, amount: b[0], bidderId: 'seed_' + b[2], ts: now - b[1] * HOUR, spotter: i === 0 }); });
    });
  }
  function resetDemo() {
    S.cars = new Map(); S.bids = []; loadDemo(); persist(); render(); toast('Examples restored. Your own spots were cleared.');
  }
  $('#reset').addEventListener('click', resetDemo);
  function boot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.uid && Array.isArray(saved.cars) && Array.isArray(saved.bids)) {
      S.uid = saved.uid; saved.cars.forEach(function (c) { S.cars.set(c.id, c); }); S.bids = saved.bids;
    } else { S.uid = 'you_' + Math.random().toString(36).slice(2, 10); loadDemo(); persist(); }
    $('#heroArt').innerHTML = heroSvg(); S.mode = 'demo'; S.write = true; render();
  }
  boot();
})();
</script>
</body>
